[project]
name = "lazysammy"
version = "0.1.0"
description = "A simple, high-level wrapper around Meta's SAM2 for image segmentation and video object tracking."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "lazysammy contributors" }]
keywords = ["sam2", "segmentation", "tracking", "computer-vision", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "SAM-2 @ git+https://github.com/facebookresearch/sam2.git",
    "numpy>=1.24",
    "torch>=2.3.1",
    "Pillow>=9.0",
    "opencv-python>=4.7",
    "pycocotools>=2.0",
    "huggingface-hub>=0.20",
]

[project.urls]
Homepage = "https://github.com/federicopozzi33/easier-sam2"
Repository = "https://github.com/federicopozzi33/easier-sam2"
Issues = "https://github.com/federicopozzi33/easier-sam2/issues"
Changelog = "https://github.com/federicopozzi33/easier-sam2/blob/main/CHANGELOG.md"

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
notebook = ["jupyterlab>=4.0", "ipywidgets>=8.0", "ipympl>=0.9", "matplotlib>=3.5"]
demo = ["gradio>=4.0", "matplotlib>=3.5"]
all = ["lazysammy[viz,notebook,demo]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lazysammy"]

[tool.hatch.build.targets.wheel.force-include]
"src/lazysammy/py.typed" = "lazysammy/py.typed"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
    "D",     # pydocstyle
    "ANN",   # flake8-annotations
    "S",     # flake8-bandit (security)
    "C4",    # flake8-comprehensions
    "PT",    # flake8-pytest-style
]
ignore = [
    "D100",   # missing module docstring
    "D104",   # missing public package docstring
    "D105",   # missing docstring in magic method
    "D107",   # missing docstring in __init__
    "D203",   # no-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "D417",   # missing argument descriptions for **kwargs
    "ANN401", # dynamically typed expressions (typing.Any)
    "E402",   # module level import not at top of file (needed for warning filters)
    "S101",   # use of assert
    "TC001",  # move application import into TYPE_CHECKING block
    "TC002",  # move third-party import into TYPE_CHECKING block
    "TC003",  # move stdlib import into TYPE_CHECKING block
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S"]
"demo/**" = [
    "RUF001",  # intentional UI emoji (➕ / ➖) in labels
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: end-to-end tests that download/load real SAM 2 weights (run with '-m integration')",
    "slow: tests that are noticeably slower than the unit suite",
]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=7.0",
    "ruff>=0.8",
]
